<title>Blink level check</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one narrow column, mobile first. Velvet bookends (landing, result hero), white middle. */
:root {
  --velvet: #03390F;
  --electric: #CFFF71;
  --white: #FFFFFF;
  --linen: #E5EBE7;
  --hairline: #EDF2F5;
  --slate: #60697A;
  --velvet-tint: rgba(3, 57, 15, .1);
  --font-head: 'Outfit', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--white);
  color: var(--velvet);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body.on-velvet { background: var(--velvet); color: var(--white); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 40px; }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.logo { display: block; width: 72px; height: auto; color: var(--velvet); }
.on-velvet .logo { color: var(--electric); }
h1, h2, h3 { font-family: var(--font-head); font-weight: 700; letter-spacing: -1px; margin: 0; text-wrap: balance; }
h1 { font-size: 44px; line-height: 1.05; }
h2 { font-size: 30px; line-height: 1.2; }
h3 { font-size: 20px; line-height: 1.25; letter-spacing: -.3px; }
p { margin: 0; }
.hl { background: var(--electric); color: var(--velvet); padding: 0 .12em; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.on-velvet .hl { background: none; color: var(--electric); padding: 0; }
.lede { color: var(--white); opacity: .9; font-weight: 300; }
.btn {
  font-family: var(--font-head); font-weight: 700; font-size: 18px; line-height: 18px;
  border: 0; border-radius: 9999px; padding: 16px 24px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none; min-height: 52px;
}
.btn-electric { background: var(--electric); color: var(--velvet); }
.btn-velvet { background: var(--velvet); color: var(--electric); }
.btn-linen { background: var(--linen); color: var(--velvet); }
.btn:focus-visible, .ans:focus-visible, .back:focus-visible, a:focus-visible { outline: 3px solid var(--velvet); outline-offset: 3px; }
.on-velvet .btn:focus-visible, .on-velvet a:focus-visible { outline-color: var(--electric); }

/* landing */
.landing { display: flex; flex-direction: column; gap: 24px; padding-top: 24px; }
.landing .fine { font-size: 14px; opacity: .75; }
.blinkie { width: 220px; max-width: 70%; height: auto; display: block; margin: 8px 0 0; }

/* quiz */
.progress { height: 6px; background: var(--linen); border-radius: 9999px; overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--velvet); border-radius: 9999px; transition: width .3s ease; }
.meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 14px; color: var(--slate); min-height: 36px; }
.back { background: none; border: 0; color: var(--velvet); font: inherit; font-size: 14px; cursor: pointer; padding: 14px 8px; }
.back[hidden] { display: none; }
.q { padding-top: 28px; display: flex; flex-direction: column; gap: 24px; animation: fade .25s ease both; }
.q .kick { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--slate); letter-spacing: 0; margin-bottom: -12px; }
.answers { display: flex; flex-direction: column; gap: 12px; }
.ans {
  text-align: left; font-family: var(--font-body); font-size: 18px; line-height: 1.35; color: var(--velvet);
  background: var(--linen); border: 0; border-radius: 12px; padding: 16px 18px; min-height: 60px; cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--hairline);
}
.ans:hover { box-shadow: inset 0 0 0 2px var(--velvet); }
.ans.sel { background: var(--velvet); color: var(--electric); box-shadow: none; }

/* loading */
.loading { padding-top: 96px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; animation: fade .25s ease both; }
.dots { display: flex; gap: 8px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--velvet); animation: pulse 1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }

/* result */
.hero { background: var(--velvet); color: var(--white); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.hero .inner { max-width: 560px; margin: 0 auto; padding-block: 20px 36px; display: flex; flex-direction: column; gap: 16px; }
.hero .top { margin-bottom: 8px; }
.radar { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; }
.radar .rg { fill: none; stroke: #CFDAD2; stroke-width: 1; }
.radar .ra { stroke: #CFDAD2; stroke-width: 1; }
.radar .rd { fill: rgba(207, 255, 113, .55); stroke: var(--velvet); stroke-width: 2.5; stroke-linejoin: round; }
.radar .rp { fill: var(--velvet); }
.radar .rl { fill: var(--velvet); font-family: var(--font-head); font-weight: 600; font-size: 15px; }
.eyebrow { font-size: 14px; opacity: .8; }
.track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.track i { height: 12px; border-radius: 9999px; background: rgba(255,255,255,.18); }
.track i.on { background: var(--electric); }
.ends { display: flex; justify-content: space-between; font-size: 13px; opacity: .75; margin-top: 6px; }
.chip { align-self: flex-start; background: var(--electric); color: var(--velvet); font-family: var(--font-head); font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 9999px; }
.hero .tag { font-family: var(--font-head); font-weight: 700; font-size: 22px; line-height: 1.25; color: var(--electric); }
.hero p.m { opacity: .92; font-weight: 300; }
.sec { padding-top: 36px; display: flex; flex-direction: column; gap: 16px; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; margin-bottom: 6px; }
.bar .row b { font-family: var(--font-head); font-weight: 600; }
.bar .row span { color: var(--slate); text-align: right; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seg i { height: 10px; border-radius: 9999px; background: var(--linen); }
.seg i.on { background: var(--velvet); }
.note { font-size: 14px; color: var(--slate); }
.step { background: var(--white); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--hairline), 0 2px 8px rgba(0,0,0,.04); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.step .k { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--slate); }
.step .pro { font-weight: 600; }
.step:not(.small) { box-shadow: inset 0 0 0 2px var(--velvet), 0 2px 8px rgba(0,0,0,.04); }
.step.plain { box-shadow: inset 0 0 0 1px var(--hairline), 0 2px 8px rgba(0,0,0,.04); }
.more-h { margin-top: 28px; }
.more { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.step.small { padding: 18px 20px; gap: 10px; }
.step.small h3 { font-size: 17px; }
.cta-slot[hidden] { display: none; }
.cta-slot { padding-top: 20px; display: flex; }
.actions { padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 640px) { h1 { font-size: 52px; } .wrap { padding-top: 32px; } }
</style>

  // Quiz order. steps[n] is the next step for someone currently at level n.
  var AREAS = [
    { key: 'foundation', name: 'Teams and directory',
      q: `A new person starts at one of your sites. How do they end up in the right teams?`,
      a: [`We add people to teams when someone asks.`, `They join the main team that everyone is in.`, `They're added to the teams for their site and role.`, `They're added to their teams, and their manager, role, and location go on their profile.`],
      fq: `When people move site or leave, what happens to their teams?`, fo: [`We update their teams by hand.`, `We check and update their teams in batches.`, `Their teams update on their own.`],
      steps: [
        s(`Create teams that match how you run the business.`, `6979746-creating-your-group-structure`),
        s(`Aim posts at the teams that need them, so everyone sees what matters to them.`, `9749053-use-cases-for-teams-and-communities`),
        s(`Fill in line managers. It opens the door to manager conversations.`, `8931677-reporting-teams-on-blink`),
        s(`Switch to teams that update themselves as people join, move, and leave.`, `6979730-configure-dynamic-teams`)] },
    { key: 'comms', name: 'Getting the news out',
      q: `A big change to shift patterns is coming. How does the news get out?`,
      a: [`Managers tell their teams at the start of a shift.`, `It's posted on the Blink feed for everyone.`, `It's posted to the teams it affects, in the languages they read.`, `It's pinned to the top for the teams it affects, with a read confirmation.`],
      fq: `Do you check who has seen it and follow up on the gaps?`, fo: [`We don't track who's seen it.`, `We look at who's seen it once it's been out a while.`, `We check who's seen it, follow up on the gaps, and our regular updates send automatically.`],
      steps: [
        s(`Post something. Weekly beats perfect.`, `14128789-what-should-i-post-on-the-feed`),
        s(`Aim your posts at the teams that need them, and turn on translation.`, `15291240-feed-post-settings`),
        s(`Feature the one post this week that matters.`, `15291240-feed-post-settings`),
        s(`Put your weekly rhythm into a journey so it sends itself.`, `6979774-feed-content-planner`)] },
    { key: 'listening', name: 'Hearing from the frontline',
      q: `Someone on the shop floor has an idea. What happens to it?`,
      a: [`They talk to their colleagues in person or on a chat we're not in.`, `They're encouraged to, and do, post ideas on Blink.`, `People speak up on posts, and we reply.`, `We ask quick questions with a poll and get real answers back.`],
      fq: `Do you run surveys and share what changed because of them?`, fo: [`We don't run surveys.`, `We run surveys and review the results.`, `We run surveys, act on the results, and tell people what changed.`],
      steps: [
        s(`Open posting to the teams where it's safe to, so people can speak up.`),
        s(`Ask questions in your posts, and reply to every comment for a month.`),
        s(`Run one poll. It takes a minute and gets a real answer.`, `10111360-a-user-guide-to-polls-on-blink`),
        s(`Run a survey, then post what you're changing because of it.`, `6979778-pulse-surveys`, true)] },
    { key: 'chat', name: 'Chat and collaboration',
      q: `A shift needs covering at short notice. How does the message reach the right people?`,
      a: [`Someone calls or messages people directly, or uses a chat outside Blink.`, `We message on Blink, one to one or in one big chat.`, `We use a Blink channel for each site or shift.`, `We use site and shift channels, and managers chat one to one with their team in Blink.`],
      fq: `Can people call each other from inside Blink?`, fo: [`Calls happen on other tools.`, `Some teams use calls in Blink.`, `Voice and video calls are a normal part of how people use Blink.`],
      steps: [
        s(`Get the team chatting in Blink.`, `6979884-chats-and-channels`),
        s(`Set up a channel for each site or shift.`, `6979884-chats-and-channels`),
        s(`Fill in line managers, then ask managers to start chats with their teams.`),
        s(`Turn on voice and video calling.`, `10721966-video-and-audio-calling-in-blink`)] },
    { key: 'onboarding', name: 'Welcoming new hires',
      q: `A new hire joins on Monday. How are they welcomed and shown what they need to know?`,
      a: [`Their manager talks them through it.`, `They're invited to Blink, usually in the next batch.`, `They're invited, and a welcome post and a folder of documents are ready.`, `A welcome runs automatically when they register, and policies need a read confirmation.`],
      fq: `Is their first month planned from their start date?`, fo: [`We plan it case by case.`, `There's a checklist the manager follows.`, `It's set up to run from their start date, with content and forms attached.`],
      steps: [
        s(`Invite people the day they join.`, `8895087-invite-your-frontline-to-join-blink-our-invite-routes`),
        s(`Write one welcome post and one welcome folder.`, `15262795-first-week-ideas`),
        s(`Automate the welcome with a journey, so it never gets forgotten.`, `7888989-journeys`),
        s(`Stretch it into a 30-day sequence that runs off their start date.`, `10330227-preboarding-journeys`)] },
    { key: 'paper', name: 'Taking admin off paper',
      q: `An employee needs the handbook, the schedule, and a time-off request form. Where do they go?`,
      a: [`A bulletin board, a shared folder, or their manager.`, `The handbook and schedule are in Blink. The form is on paper.`, `The handbook and schedule are in Blink, and policy updates are confirmed there too.`, `It's all in Blink, and the time-off request is a digital form.`],
      fq: `Do people open the schedule and other work systems from inside Blink?`, fo: [`They open them separately.`, `Some systems open from inside Blink.`, `Most of what they need opens from inside Blink, so little gets printed.`],
      steps: [
        s(`Upload the handbook, the policies, and the schedule to the hub.`, `6979891-what-is-the-hub`),
        s(`Make your next policy update a mandatory read.`, `6979848-mandatory-reads`),
        s(`Pick one paper form and rebuild it as a digital form.`, `6979812-forms`, true),
        s(`Add a single sign-on link to whatever your team prints today.`, `7926301-sso-into-third-party-systems`, true)] },
    { key: 'culture', name: 'Recognition and culture',
      q: `Someone on the late shift has gone above and beyond. What happens?`,
      a: [`Their manager thanks them in person.`, `Someone posts a thank you on Blink.`, `It's posted under one of our company values.`, `Managers across the business post recognition, tied to our values.`],
      fq: `Are there regular events and community posts around recognition?`, fo: [`It happens as it comes up.`, `We have the odd event or community post.`, `There's a regular rhythm of events and posts that people join in on.`],
      steps: [
        s(`Recognize one person this week.`, `6979767-how-to-create-useful-content-on-blink`),
        s(`Name your values and use them as feed categories.`, `6979905-customizing-your-feed-categories`),
        s(`Ask every manager to recognize someone once a month.`, `6979740-kudos-recognition-for-your-employees`),
        s(`Make it a monthly fixture that people look forward to.`, `11403649-events-in-blink`)] }
  ];

  var RANKS = [
    { n: `Novice`, tag: `You're at the start of something good, and there's plenty to build on.`, m: `You're at the start, which is the best place to build from. A few small moves will make a big difference.` },
    { n: `Apprentice`, tag: `You've got the basics down.`, m: `Blink is part of how you work. Now it's about aiming it at the right people.` },
    { n: `Practitioner`, tag: `You know what you're doing.`, m: `Blink works for you day to day, and your teams feel it. Next is making the important things land.` },
    { n: `Expert`, tag: `You run Blink with confidence.`, m: `Your people hear what matters, speak up, and find what they need. What's left is measuring it and letting the routine run itself.` },
    { n: `Elite`, tag: `You've climbed to the top.`, m: `Blink is a working part of how you run the business, and much of it runs itself. Keep it fresh, and show others how you did it.` },
    { n: `Pioneer`, tag: `You've mastered the map, and there's more to find.`, m: `Every area is working for you. The next gains come from going further, so keep exploring.` }
  ];
  // Shown instead of next steps when every area is at the top. Links go to the website pages.
  var EXPLORE = [
    { k: 'Task management', t: `Give every shift a clear list of what to get done, and when.`, url: 'https://www.joinblink.com/features/task-management', label: 'Explore task management' },
    { k: 'Frontline AI', t: `Put answers and action in your team's hands, with AI that answers questions, automates tasks, and translates messages in the app they already use.`, url: 'https://www.joinblink.com/product/frontline-ai', label: 'Explore frontline AI' }
  ];
  // Answers are shown in a random order, kept stable per question for the attempt. data-ix stays the original level.
  function shuffled(n) {
    var a = [], j, t, i;
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  var app = document.getElementById('app');
  var st = { i: 0, phase: 'q', lv: [], hist: [], ord: {} };

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function logo() { return '<svg class="logo" viewBox="0 0 336 108" role="img" aria-label="Blink."><use href="#blink-logo"/></svg>'; }
  function velvetBody(on) { document.body.classList.toggle('on-velvet', !!on); }

  function landing() {
    velvetBody(true);
    app.innerHTML = '<div class="wrap"><div class="top">' + logo() + '</div>' +
      '<div class="landing"><h1>How far have you <span class="hl">come</span> with Blink?</h1>' +
      '<p class="lede">Answer a few quick questions about how your team uses Blink. You\'ll see where you are on the climb from novice to elite and beyond, and the one move that\'ll help most.</p>' +
      '<div><button class="btn btn-electric" id="start" type="button">Start the quiz</button></div>' +
      '<p class="fine">About 3 minutes. Nothing\'s saved or sent anywhere.</p>' +
      '<img class="blinkie" alt="" src="' + BLINKIE + '"></div></div>';
    document.getElementById('start').onclick = function () { st = { i: 0, phase: 'q', lv: [], hist: [], ord: {} }; question(); };
    window.scrollTo(0, 0);
  }

  function question() {
    velvetBody(false);
    var L = AREAS[st.i], f = st.phase === 'f';
    var pct = ((st.i + (f ? 0.5 : 0)) / AREAS.length) * 100;
    var opts = f ? L.fo : L.a;
    var html = '<div class="wrap"><div class="top">' + logo() + '</div>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + AREAS.length + '" aria-valuenow="' + st.i + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="meta"><button class="back" id="back" type="button"' + (st.hist.length ? '' : ' hidden') + '>&larr; Back</button><span>' + (st.i + 1) + ' / ' + AREAS.length + '</span></div>' +
      '<div class="q" aria-live="polite">' + (f ? '<p class="kick">One more on this one</p>' : '') +
      '<h2>' + esc(f ? L.fq : L.q) + '</h2><div class="answers">';
    var okey = st.i + st.phase;
    if (!st.ord[okey]) st.ord[okey] = shuffled(opts.length);
    st.ord[okey].forEach(function (ix) { html += '<button class="ans" type="button" data-ix="' + ix + '">' + esc(opts[ix]) + '</button>'; });
    html += '</div></div></div>';
    app.innerHTML = html;
    window.scrollTo(0, 0);
    var b = document.getElementById('back'); if (b) b.onclick = back;
    Array.prototype.forEach.call(app.querySelectorAll('.ans'), function (el) {
      el.onclick = function () {
        el.classList.add('sel');
        var ix = +el.getAttribute('data-ix');
        setTimeout(function () { answer(ix); }, 220);
      };
    });
  }

  function answer(ix) {
    st.hist.push({ i: st.i, phase: st.phase, lv: st.lv.slice() });
    if (st.phase === 'q') {
      st.lv[st.i] = ix;
      if (ix === 3) { st.phase = 'f'; return question(); }
    } else {
      st.lv[st.i] = ix === AREAS[st.i].fo.length - 1 ? 4 : 3; // only the fullest follow-up answer scores level 4
      st.phase = 'q';
    }
    next();
  }
  function next() {
    st.phase = 'q';
    if (st.i + 1 < AREAS.length) { st.i++; question(); } else { loading(); }
  }
  function back() {
    var h = st.hist.pop(); if (!h) return;
    st.i = h.i; st.phase = h.phase; st.lv = h.lv; question();
  }

  function loading() {
    velvetBody(false);
    app.innerHTML = '<div class="wrap"><div class="loading" aria-live="polite"><div class="dots"><i></i><i></i><i></i></div><h2>Working out where you are</h2></div></div>';
    window.scrollTo(0, 0);
    setTimeout(function () { show(compute(st.lv)); }, 1500);
  }

  function compute(lv) {
    var sum = lv.reduce(function (a, b) { return a + b; }, 0);
    var order = TIE.map(function (k) { return AREAS.findIndex(function (l) { return l.key === k; }); });
    var strongest = order[0];
    order.forEach(function (ix) { if (lv[ix] > lv[strongest]) strongest = ix; });
    var cand = order.filter(function (ix) { return lv[ix] < 4; }).sort(function (a, b) { return lv[a] - lv[b] || order.indexOf(a) - order.indexOf(b); });
    var pick = null;
    for (var c = 0; c < cand.length; c++) { if (!AREAS[cand[c]].steps[lv[cand[c]]].pro) { pick = cand[c]; break; } }
    if (pick === null && cand.length) pick = cand[0];
    // Up to three steps, one leading. Never more than one Pro step across all three.
    var picks = pick === null ? [] : [pick], proCount = pick !== null && AREAS[pick].steps[lv[pick]].pro ? 1 : 0;
    for (var m = 0; m < cand.length && picks.length < 3; m++) {
      if (picks.indexOf(cand[m]) !== -1) continue;
      var isPro = AREAS[cand[m]].steps[lv[cand[m]]].pro;
      if (isPro && proCount > 0) continue;
      picks.push(cand[m]); if (isPro) proCount++;
    }
    var rank = sum <= 6 ? 0 : sum <= 12 ? 1 : sum <= 18 ? 2 : sum <= 24 ? 3 : sum <= 27 ? 4 : 5;
    var mx = Math.max.apply(null, lv), mn = Math.min.apply(null, lv);
    return { lv: lv, rank: rank, strongest: (mx > 0 && mx > mn) ? strongest : null, pick: pick, picks: picks, step: pick === null ? null : AREAS[pick].steps[lv[pick]] };
  }

  var SHORT = ['Teams', 'News', 'Listening', 'Chat', 'New hires', 'Paperwork', 'Recognition'];
  function radar(lv) {
    var N = AREAS.length, cx = 200, cy = 200, R = 104;
    function pt(i, rad) { var a = (2 * Math.PI * i) / N; return [cx + rad * Math.sin(a), cy - rad * Math.cos(a)]; }
    function poly(rad) { var o = []; for (var i = 0; i < N; i++) o.push(pt(i, rad).join(',')); return o.join(' '); }
    var d = [], desc = [], s = '';
    for (var g = 1; g <= 4; g++) s += '<polygon class="rg" points="' + poly((R * g) / 4) + '"/>';
    for (var i = 0; i < N; i++) {
      var e = pt(i, R); s += '<line class="ra" x1="' + cx + '" y1="' + cy + '" x2="' + e[0] + '" y2="' + e[1] + '"/>';
      d.push(pt(i, (R * lv[i]) / 4));
      desc.push(SHORT[i] + ': ' + LEVELS[lv[i]]);
    }
    s += '<polygon class="rd" points="' + d.map(function (p) { return p.join(','); }).join(' ') + '"/>';
    d.forEach(function (p) { s += '<circle class="rp" cx="' + p[0] + '" cy="' + p[1] + '" r="4.5"/>'; });
    for (var j = 0; j < N; j++) {
      var a = (2 * Math.PI * j) / N, sn = Math.sin(a), cs = Math.cos(a), l = pt(j, R + 20);
      var anchor = sn > 0.3 ? 'start' : sn < -0.3 ? 'end' : 'middle';
      var dy = cs > 0.5 ? '0' : cs < -0.5 ? '0.8em' : '0.35em';
      s += '<text class="rl" x="' + l[0] + '" y="' + l[1] + '" dy="' + dy + '" text-anchor="' + anchor + '">' + esc(SHORT[j]) + '</text>';
    }
    return '<svg class="radar" viewBox="0 0 400 400" role="img" aria-label="' + esc(desc.join('. ')) + '">' + s + '</svg>';
  }

  function show(r) {
    velvetBody(false);
    var rk = RANKS[r.rank], track = '';
    for (var t = 0; t < RANKS.length; t++) track += '<i class="' + (t <= r.rank ? 'on' : '') + '"></i>';
    var h = '<div class="hero"><div class="inner"><div class="top">' + logo() + '</div>' +
      '<p class="eyebrow">Where you are</p><h1>' + esc(rk.n) + '</h1>' +
      '<div><div class="track" role="img" aria-label="' + esc(rk.n) + ', step ' + (r.rank + 1) + ' of 6 from novice to pioneer">' + track + '</div><div class="ends"><span>Novice</span><span>Pioneer</span></div></div>' +
      '<p class="tag">' + esc(rk.tag) + '</p><p class="m">' + esc(rk.m) + '</p>' +
      (r.strongest !== null ? '<p class="m">Your strongest area: <b>' + esc(AREAS[r.strongest].name) + '</b>.</p>' : '') + '</div></div>';
    h += '<div class="wrap" style="padding-top:0"><div class="sec"><h2>Your strengths at a glance</h2>' + radar(r.lv) +
      (r.rank < 5 ? '<p class="note">The middle is a fresh start. The edge is proving it and repeating it.</p>' : '') + '</div>';
    function stepBody(ix) {
      var st = AREAS[ix].steps[r.lv[ix]], b = '<p class="k">' + esc(AREAS[ix].name) + '</p><h3>' + esc(st.t) + '</h3>';
      if (st.pro) b += '<p class="pro">' + PRO_LINE + '</p>';
      if (st.a) b += '<div><a class="btn btn-linen" target="_blank" rel="noopener" href="' + HELP + st.a + '">Read the help article</a></div>';
      return b;
    }
    if (r.step) {
      h += '<div class="sec"><h2>Your next step</h2><div class="step">' + stepBody(r.pick) + '</div>';
    } else {
      h += '<div class="sec"><h2>Keep exploring</h2><div class="more">';
      EXPLORE.forEach(function (x) {
        h += '<div class="step plain"><p class="k">' + esc(x.k) + '</p><h3>' + esc(x.t) + '</h3><div><a class="btn btn-linen" target="_blank" rel="noopener" href="' + x.url + '">' + esc(x.label) + '</a></div></div>';
      });
      h += '</div>';
    }
    if (r.picks.length > 1) {
      h += '<h2 class="more-h">' + (r.picks.length === 2 ? 'One more when you\'re ready' : 'Two more when you\'re ready') + '</h2><div class="more">';
      for (var pi = 1; pi < r.picks.length; pi++) h += '<div class="step small">' + stepBody(r.picks[pi]) + '</div>';
      h += '</div>';
    }
    h += '</div>';
    // Call to action slot: hidden while the link is empty, so it leaves no gap.
    h += '<div class="cta-slot" id="cta"' + (CTA_URL ? '' : ' hidden') + '>' + (CTA_URL ? '<a class="btn btn-velvet" target="_blank" rel="noopener" href="' + esc(CTA_URL) + '">' + esc(CTA_LABEL) + '</a>' : '') + '</div>';
    h += '<div class="actions"><button class="btn btn-linen" id="retake" type="button">Retake the quiz</button></div></div>';
    app.innerHTML = h;
    window.scrollTo(0, 0);
    document.getElementById('retake').onclick = landing;
  }

  window.__quiz = { compute: compute, AREAS: AREAS, show: show, radar: radar, question: question, answer: answer, state: function () { return st; }, reset: function () { st = { i: 0, phase: 'q', lv: [], hist: [], ord: {} }; }, EXPLORE: EXPLORE };
  landing();
})();
</script>
